# Python prompt corpus.
#
# Fields:
#   id           stable identifier — never reuse or renumber, results reference it
#   ecosystem    python | javascript
#   domain       for slicing results by problem area
#   specificity  vague | detailed | niche
#                  vague    - underspecified, the way people actually ask
#                  detailed - a real spec with constraints
#                  niche    - deliberately pushes toward obscure/specialist libraries,
#                             where hallucination rates are expected to climb
#   text         the prompt, exactly as sent
#
# IMPORTANT: `niche` prompts are expected to inflate hallucination rates. Results must
# be sliced by specificity so everyday rates and niche rates are never conflated in a
# headline number.

- id: py-scrape-01
