[project]
name = "slopsquat"
version = "0.1.0"
description = "Measurement harness for slopsquatting: how often, and how reproducibly, do LLMs hallucinate package names that do not exist?"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Chris Holman" }]

dependencies = [
    "anthropic>=0.40",
    "openai>=1.50",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "duckdb>=1.1",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
charts = [
    "matplotlib>=3.9",
]

[project.scripts]
slopsquat = "slopsquat.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slopsquat"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Run the suite without installing the package first, so `pytest` works from a bare
# checkout as well as from an editable install.
pythonpath = ["src"]
