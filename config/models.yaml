# Models under test.
#
# `id` is a stable key used to slice results — keep it constant across runs even if the
# underlying model alias moves, so historical records stay comparable.
#
# `model` is the alias sent to the provider. Aliases are used deliberately: they are
# what a developer gets when they don't think about versioning, which is the condition
# this study is about. The harness records the RESOLVED version the API reports back on
# every call, so reproducibility is preserved without pinning — and any published claim
# should cite that recorded version, not the alias.
#
# `params` are an experimental axis, not a hidden constant. Reasoning depth plausibly
# changes hallucination rate, so it is configured explicitly and stored per-record.

models:
  # ---- Anthropic ---------------------------------------------------------------
  - id: anthropic/opus-5
    provider: anthropic
    model: claude-opus-5
    enabled: true
    params:
      max_tokens: 4096
      # Opus 5 thinks by default; "adaptive" states that explicitly. Set to "disabled"
      # (allowed only at effort high or below) to measure the no-reasoning condition.
      thinking: adaptive
      effort: high

  - id: anthropic/sonnet-5
    provider: anthropic
    model: claude-sonnet-5
    enabled: true
    params:
      max_tokens: 4096
      thinking: adaptive
      effort: high

  - id: anthropic/haiku-4-5
    provider: anthropic
    model: claude-haiku-4-5
    enabled: false          # enable for a cheap cross-tier comparison
    params:
      max_tokens: 4096

  # ---- OpenAI ------------------------------------------------------------------
  - id: openai/gpt-5
    provider: openai
    model: gpt-5
    enabled: true
    params:
      max_tokens: 4096

  - id: openai/gpt-5-mini
    provider: openai
    model: gpt-5-mini
    enabled: true
    params:
      max_tokens: 4096

  # Coding-specialised sibling of gpt-5. The comparison against openai/gpt-5 asks
  # whether tuning a model for code reduces package hallucination — a question with no
  # published answer, and the most novel axis in this corpus. Keep params identical to
  # openai/gpt-5 so the specialisation is the only variable.
  - id: openai/gpt-5-codex
    provider: openai
    model: gpt-5-codex
    enabled: true
    params:
      max_tokens: 4096

# Sent as the system prompt to every model. Deliberately neutral: it must not nudge
# toward or away from naming dependencies, or it becomes a confound.
system_prompt: |
  You are helping a developer with a coding task. Answer as you normally would,
  including any code you think is useful.
